# Local / single-host deployment: Qdrant + Postgres + API + web.
# AWS credentials: on EC2/ECS use an IAM role (leave BEDROCK_AWS_PROFILE empty).
# Locally you can mount ~/.aws read-only and set BEDROCK_AWS_PROFILE.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    volumes: [qdrant:/qdrant/storage]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pdfinsight
      POSTGRES_USER: pdfinsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfinsight"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://pdfinsight:${POSTGRES_PASSWORD}@postgres:5432/pdfinsight
      DATA_DIR: /data
    volumes:
      - data:/data
      # - ~/.aws:/app/.aws:ro   # local only; also set AWS_CONFIG_FILE/AWS_SHARED_CREDENTIALS_FILE
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }

  frontend:
    build:
      context: ./frontend
      args: { BACKEND_URL: http://backend:8000 }
    restart: unless-stopped
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  qdrant:
  pg:
  data:
